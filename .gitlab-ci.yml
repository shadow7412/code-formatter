stages:
  - test
  - image

default:
  interruptible: true

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

.node_cache: &node_cache
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

test:node:
  stage: test
  image: node:24-alpine
  tags:
    - docker
    - lime
  cache: *node_cache
  script:
    - npm ci
    - npm run typecheck
    - npm run build
    - npm test

container:image:
  stage: image
  image: docker:27-cli
  tags:
    - docker_build
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      IMAGES="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        IMAGES="$IMAGES $CI_REGISTRY_IMAGE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGES="$IMAGES $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
      BUILD_ARGS=""
      for image in $IMAGES; do
        BUILD_ARGS="$BUILD_ARGS -t $image"
      done
      docker build --pull $BUILD_ARGS .
      for image in $IMAGES; do
        docker push "$image"
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
